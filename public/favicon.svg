<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#0F172A"/>
  
  <!-- Network nodes (círculos de conexão) -->
  <circle cx="25" cy="50" r="6" fill="#00B4D8"/>
  <circle cx="50" cy="35" r="6" fill="#FFFFFF"/>
  <circle cx="75" cy="50" r="6" fill="#00B4D8"/>
  <circle cx="50" cy="65" r="6" fill="#FFFFFF"/>
  
  <!-- Connection lines (forming S shape) -->
  <path 
    d="M 25 50 Q 37.5 35 50 35" 
    stroke="#00B4D8" 
    stroke-width="3" 
    fill="none"
    stroke-linecap="round"
  />
  <path 
    d="M 50 35 Q 62.5 35 75 50" 
    stroke="#FFFFFF" 
    stroke-width="3" 
    fill="none"
    stroke-linecap="round"
  />
  <path 
    d="M 75 50 Q 62.5 65 50 65" 
    stroke="#00B4D8" 
    stroke-width="3" 
    fill="none"
    stroke-linecap="round"
  />
  
  <!-- Growth arrow -->
  <path 
    d="M 73 27 L 83 17 L 83 27 Z" 
    fill="#00B4D8"
  />
  <line 
    x1="55" 
    y1="45" 
    x2="83" 
    y2="22" 
    stroke="#00B4D8" 
    stroke-width="2"
    stroke-dasharray="3 2"
  />
</svg>
